<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>喂奶记录助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#ededed;height:100vh;height:100dvh;
  display:flex;flex-direction:column;max-width:500px;margin:0 auto;
  -webkit-tap-highlight-color:transparent;
}
.header{
  background:#07c160;color:#fff;padding:12px 16px;text-align:center;
  font-size:17px;font-weight:600;position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
}
.header .title{display:flex;align-items:center;gap:8px}
.header-controls{display:flex;align-items:center;gap:8px}
.header .mini-btn{
  background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 10px;
  border-radius:14px;font-size:12px;cursor:pointer;line-height:1
}
.header .font-group{display:flex;background:rgba(255,255,255,.2);border-radius:14px;overflow:hidden}
.header .font-group .mini-btn{background:transparent;border-radius:0;padding:6px 10px;min-width:34px}
.header .font-group .mini-btn + .mini-btn{border-left:1px solid rgba(255,255,255,.35)}
.msg.bot a{color:#2f78ff;text-decoration:underline}

body.font-sm .msg,body.font-sm .card,body.font-sm .summary-card,body.font-sm .input-area input{font-size:13px}
body.font-lg .msg,body.font-lg .card,body.font-lg .summary-card,body.font-lg .input-area input{font-size:17px}
body.font-xl .msg,body.font-xl .card,body.font-xl .summary-card,body.font-xl .input-area input{font-size:20px}

.chat-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}

.msg{max-width:85%;padding:10px 14px;border-radius:8px;font-size:15px;line-height:1.5;word-break:break-word}
.msg.bot{background:#fff;align-self:flex-start;border-radius:4px 8px 8px 8px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.msg.user{background:#95ec69;align-self:flex-end;border-radius:8px 4px 8px 8px}
.msg.time{align-self:center;font-size:12px;color:#999;background:none;padding:4px 8px}

.typing{align-self:flex-start;padding:8px 14px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#999;margin:0 2px;animation:blink 1.4s infinite both}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.card{
  align-self:flex-start;background:#fff;border-radius:8px;
  padding:12px;margin:4px 0;font-size:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.08);max-width:95%
}
.card .card-title{font-size:13px;color:#07c160;font-weight:600;margin-bottom:8px}
.card .row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:#333}
.card .row .lbl{color:#999}
.card .row.hidden{display:none}
.card .row.edit{align-items:center;gap:8px}
.card .row.edit .lbl{min-width:44px}
.card .edit-input,.card .edit-select{
  flex:1;min-width:0;border:1px solid #d9d9d9;border-radius:6px;
  padding:6px 8px;font-size:13px;background:#fff;color:#333
}
.card .actions{display:flex;gap:8px;margin-top:10px}
.card .btn{flex:1;padding:9px 0;border-radius:6px;border:none;font-size:14px;cursor:pointer;font-weight:500}
.card .btn.confirm{background:#07c160;color:#fff}
.card .btn.cancel{background:#f5f5f5;color:#666}

.summary-card{
  align-self:flex-start;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);
  border-radius:10px;padding:14px;font-size:14px;width:100%;
  box-shadow:0 1px 3px rgba(0,0,0,.1)
}
.summary-card h3{font-size:1em;margin-bottom:10px;color:#2e7d32;font-weight:600}
.summary-card .stat{display:flex;gap:12px;margin-bottom:8px;justify-content:space-around}
.summary-card .si{text-align:center}
.summary-card .si .n{font-size:1.15em;font-weight:600;color:#333}
.summary-card .si .l{font-size:1em;color:#555}
.summary-card .recent{margin-top:10px;border-top:1px solid rgba(0,0,0,.1);padding-top:8px}
.summary-card .recent .rh{font-size:1em;color:#555;margin-bottom:4px}
.summary-card .recent .ri{font-size:1em;color:#555;padding:2px 0}

.input-area{
  background:#f7f7f7;padding:10px 12px;display:flex;align-items:center;gap:8px;
  border-top:1px solid #ddd;position:sticky;bottom:0
}
.input-area input{
  flex:1;padding:10px 14px;border:none;border-radius:20px;
  font-size:15px;outline:none;background:#fff
}
.vbtn,.sbtn{
  width:40px;height:40px;border-radius:50%;border:none;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0
}
.vbtn{background:#fff;color:#666}
.vbtn.listening{background:#ff4444;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.4)}50%{box-shadow:0 0 0 12px rgba(255,68,68,0)}}
.sbtn{background:#07c160;color:#fff;font-size:18px}
.sbtn:disabled{background:#ccc}

.vs{text-align:center;padding:8px;color:#ff4444;font-size:13px;font-weight:500;background:#fff;border-top:1px solid #ffcdd2}

.modal-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);
  z-index:100;justify-content:center;align-items:center
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:12px;padding:20px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto
}
.modal h3{font-size:17px;margin-bottom:12px;text-align:center}
.modal .record-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.modal .record-item .del{color:#ff4444;background:none;border:none;font-size:16px;cursor:pointer;padding:4px 8px}
.modal .csv-area{width:100%;height:200px;font-size:12px;font-family:monospace;border:1px solid #ddd;border-radius:8px;padding:10px;margin:10px 0;resize:vertical}
.modal .copy-btn{width:100%;padding:12px;background:#07c160;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:8px}
.modal .close-btn{width:100%;padding:10px;background:#f5f5f5;color:#666;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-top:6px}
</style>
</head>
<body>

<div class="header">
  <div class="title"><span style="font-size:22px">🍼</span> <span id="appTitle">喂奶记录助手</span></div>
  <div class="header-controls">
    <div class="font-group" aria-label="Font size controls">
      <button class="mini-btn" id="fontDownBtn" type="button">A-</button>
      <button class="mini-btn" id="fontUpBtn" type="button">A+</button>
    </div>
    <button class="mini-btn" id="langBtn" type="button">EN</button>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="msg bot" id="welcomeMsg"></div>
  <div class="msg time" id="todayLabel"></div>
</div>

<div class="vs" id="voiceStatus" style="display:none">🎤 正在聆听...请说话</div>

<div class="input-area">
  <button class="vbtn" id="voiceBtn">🎤</button>
  <input type="text" id="textInput" placeholder="说说宝宝的情况..." autocomplete="off" enterkeyhint="send">
  <button class="sbtn" id="sendBtn">➤</button>
</div>

<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <h3 id="modalTitle">📋 所有记录</h3>
    <div id="recordList" style="max-height:200px;overflow-y:auto"></div>
    <textarea class="csv-area" id="csvOutput" readonly placeholder="暂无记录"></textarea>
    <button class="copy-btn" id="copyBtn" onclick="copyCSV()">📋 复制 CSV</button>
    <button class="copy-btn" id="downloadBtn" style="background:#576b95;margin-top:6px" onclick="downloadCSV()">💾 下载 CSV 文件</button>
    <button class="close-btn" id="closeBtn" onclick="closeExport()">关闭</button>
  </div>
</div>

<script>
const STORAGE_KEY='feeding_bot_records';
const UI_LANG_KEY='feeding_bot_lang';
const UI_FONT_KEY='feeding_bot_font';

// 🔧 Paste your Google Apps Script Web App URL here:
//    1. Open your Google Sheet -> Extensions -> Apps Script
//    2. Paste apps-script.gs code -> Deploy -> New Deployment -> Web App -> Anyone
//    3. Copy the URL and replace the line below
const SYNC_SERVER='https://script.google.com/macros/s/AKfycbylyLh8rz_RVjq8t0bUEYKIH70sRryk7hLiPWUkrc24/exec';

// 🔧 Paste your Google Sheet URL here for hyperlink in sync messages
const GOOGLE_SHEET_URL='https://docs.google.com/spreadsheets/d/1xLyHnIfcBXxQFHC8Z84ZHnGA7yEPGF4Kd4mxugwJ0XI/edit?usp=sharing';
const SUMMARY_TIMEZONE='America/Los_Angeles';

const I18N={
  zh:{

    canceled:'已取消 👍',
    syncSubmittedNoLink:'✅ 已提交同步请求，请在 Google Sheet 中确认。',
    syncSubmittedPrefix:'✅ 已提交同步请求，查看 ',
    localSaved:'✅ 已本地记录（未启用 Google 同步）',
    unrecognizedHtml:'🤔 没有识别到喂奶或便便信息。<br><br>你可以这样说：<br>• "刚刚喝了80毫升奶粉"<br>• "上午11点喝了60ml，没打嗝"<br>• "晚上8点半拉了便便"',
    voiceNoSpeech:'没有听到声音，请再试一次 🙉',
    voiceNotAllowed:'麦克风权限未开启，请在浏览器设置中允许 📢',
    voiceError:'语音识别出错，请用文字输入 📝',

    csvCopied:'CSV 已复制到剪贴板！',
    csvCopyFailed:'复制失败，请手动选择并复制',

    csvHeader:'Date 日期,Time 时间,Event 事件,Volume 奶量,Notes 备注',
    weekdays:['日','一','二','三','四','五','六'],
    eventLabels:{Feeding:'🍼 喂奶',Diaper:'💩 拉粑粑',Other:'📝 其他'},
    eventPlain:{Feeding:'喂奶',Diaper:'拉粑粑',Other:'其他'},
    welcomeHtml:'👋 你好！我是喂奶记录助手。<br><br>你可以用<b>语音 🎤</b>或<b>文字</b>告诉我宝宝的情况。<br><br>💬 试试说：<br>• "刚刚喝了80毫升奶粉"<br>• "上午11点喝了60ml，没打嗝"<br>• "晚上8点半拉了便便"'
  },
  en:{
    appTitle:'Feeding Log Assistant',
    voiceListening:'🎤 Listening... please speak',
    inputPlaceholder:'Describe your baby update...',
    modalTitle:'📋 All Records',
    noRecords:'No records yet',
    copyCsv:'📋 Copy CSV',
    downloadCsv:'💾 Download CSV',
    close:'Close',
    todaySummary:'📊 Today Summary',
    feedingCount:'Feedings',
    totalVolume:'Total Volume',
    diaperCount:'Diapers',
    recentRecords:'Recent records',
    confirmTitle:'📋 Confirm Recognition',
    lblDate:'Date',
    lblTime:'Time',
    lblEvent:'Event',
    lblVolume:'Volume',
    lblNotes:'Notes',
    btnCancel:'Cancel',
    btnConfirm:'✅ Save',
    syncing:'Syncing...',
    recordFailed:'❌ Save failed, please retry',
    canceled:'Canceled 👍',
    syncSubmittedNoLink:'✅ Sync request submitted. Please check Google Sheet.',
    syncSubmittedPrefix:'✅ Sync request submitted. Open ',
    localSaved:'✅ Saved locally (Google sync disabled)',
    unrecognizedHtml:'🤔 I could not detect feeding or diaper info.<br><br>Try saying:<br>• "Just fed 80 ml formula"<br>• "Fed 60 ml at 11:00, no burp"<br>• "Pooped at 20:30"',
    voiceNoSpeech:'No speech detected, please try again 🙉',
    voiceNotAllowed:'Microphone permission is blocked. Please allow it in browser settings 📢',
    voiceError:'Speech recognition error. Please type your message 📝',
    deleteConfirm:'Delete this record?',
    csvCopied:'CSV copied to clipboard!',
    csvCopyFailed:'Copy failed. Please select and copy manually',
    downloadName:'feeding-log.csv',
    csvHeader:'Date,Time,Event,Volume (ml),Notes',
    weekdays:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    eventLabels:{Feeding:'🍼 Feeding',Diaper:'💩 Diaper',Other:'📝 Other'},
    eventPlain:{Feeding:'Feeding',Diaper:'Diaper',Other:'Other'},
    welcomeHtml:'👋 Hi! I am your feeding log assistant.<br><br>You can tell me updates by <b>voice 🎤</b> or <b>text</b>.<br><br>💬 Try:<br>• "Just fed 80 ml formula"<br>• "Fed 60 ml at 11:00, no burp"<br>• "Pooped at 20:30"'
  }
};

const chatArea=document.getElementById('chatArea');
const textInput=document.getElementById('textInput');
const sendBtn=document.getElementById('sendBtn');
const voiceBtn=document.getElementById('voiceBtn');
const voiceStatus=document.getElementById('voiceStatus');
const appTitle=document.getElementById('appTitle');
const welcomeMsg=document.getElementById('welcomeMsg');
const modalTitle=document.getElementById('modalTitle');
const copyBtn=document.getElementById('copyBtn');
const downloadBtn=document.getElementById('downloadBtn');
const closeBtn=document.getElementById('closeBtn');
const langBtn=document.getElementById('langBtn');
const fontDownBtn=document.getElementById('fontDownBtn');
const fontUpBtn=document.getElementById('fontUpBtn');

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;
let isListening=false;
let currentLang=localStorage.getItem(UI_LANG_KEY)||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');
let currentFont=localStorage.getItem(UI_FONT_KEY)||'md';

function t(key){return(I18N[currentLang]&&I18N[currentLang][key])||(I18N.zh&&I18N.zh[key])||key}
function eventLabel(event){return t('eventLabels')[event]||event}
function eventPlain(event){return t('eventPlain')[event]||event}
function isCloudSyncEnabled(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/(exec|dev)$/i.test(SYNC_SERVER)}
function getSheetLinkHtml(){
  if(!/^https:\/\/docs\.google\.com\/spreadsheets\//i.test(GOOGLE_SHEET_URL))return '';
  return `<a href="${GOOGLE_SHEET_URL}" target="_blank" rel="noopener">Google Sheet</a>`;
}

function normalizeInput(raw){
  return(raw||'')
    .replace(/[，、]/g,',')
    .replace(/[。！!？?；;]/g,' ')
    .replace(/[：]/g,':')
    .replace(/\b(\d+)\s*m\s*l\b/ig,'$1ml')
    .replace(/\b(\d+)\s*c\s*c\b/ig,'$1cc')
    .replace(/毫\s*升/g,'毫升')
    .replace(/点钟/g,'点')
    .replace(/\s+/g,' ')
    .trim();
}

function sanitizeNotes(note,event){
  let n=(note||'').trim();
  const common=[
    /\b(just now|just|at|around|about|baby|the baby|today)\b/ig,
    /刚刚|刚才|宝宝|今天|刚/g,
    /(^|\s)(点喝了|点喝|点喂了|点喂|点吃了|点吃)(?=\s|$)/g
  ];
  common.forEach(re=>{n=n.replace(re,' ')});

  if(event==='Feeding'){
    [
      /喝了|喂了|吃了|喝奶|喂奶|吃奶|奶粉|母乳|亲喂|瓶喂|哺乳/g,
      /\b(feed|fed|feeding|formula|bottle|milk|breastmilk|nursing)\b/ig
    ].forEach(re=>{n=n.replace(re,' ')});
  }
  if(event==='Diaper'){
    [
      /拉粑粑|拉屎|大便|便便|拉臭|拉臭臭|换尿布|尿布|尿了|小便|嘘嘘|尿不湿|纸尿裤/g,
      /\b(diaper|nappy|poop|pooped|pee|peed|stool|potty|dirty|wet)\b/ig
    ].forEach(re=>{n=n.replace(re,' ')});
  }

  n=n.replace(/^[,，。.!！？\s]+|[,，。.!！？\s]+$/g,'').replace(/\s+/g,' ').trim();
  if(/^(喝了|喂了|吃了|拉了|点喝了|点喝|点喂了|点喂|点吃了|点吃|feed|fed|feeding|poop|pooped|diaper|just|at|around|about)$/i.test(n))return '';
  if(n.length<=1)return '';
  return n;
}

function formatLocalDate(dateObj){
  const y=dateObj.getFullYear();
  const m=String(dateObj.getMonth()+1).padStart(2,'0');
  const d=String(dateObj.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function getRecords(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}
function saveRecords(records){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}

function addRecord(rec){
  const records=getRecords();
  rec.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  rec.createdAt=new Date().toISOString();
  records.push(rec);
  saveRecords(records);
  return rec;
}

function deleteRecord(id){
  const records=getRecords().filter(r=>r.id!==id);
  saveRecords(records);
}

function getLocalSummary(){
  const today=formatLocalDate(new Date());
  const records=getRecords().filter(r=>r.date===today);
  const feedings=records.filter(r=>r.event==='Feeding');
  const diapers=records.filter(r=>r.event==='Diaper');
  return{
    date:today,
    feedingCount:feedings.length,
    diaperCount:diapers.length,
    totalVolume:Math.round(feedings.reduce((s,r)=>s+(parseFloat(r.volume)||0),0)),
    records:records.sort((a,b)=>b.time.localeCompare(a.time))
  };
}

function initSpeech(){
  if(!SpeechRecognition){voiceBtn.style.display='none';return}
  recognition=new SpeechRecognition();
  recognition.lang=currentLang==='zh'?'zh-CN':'en-US';
  recognition.interimResults=true;
  recognition.continuous=false;
  recognition.maxAlternatives=3;
  recognition.onresult=e=>{
    const rs=e.results[e.results.length-1];
    if(!rs||!rs.isFinal)return;
    const text=normalizeInput(rs[0].transcript.trim());
    stopListening();
    if(text)addUserMsg(text);
  };
  recognition.onerror=e=>{
    stopListening();
    if(e.error==='no-speech')addBotMsg(t('voiceNoSpeech'));
    else if(e.error==='not-allowed')addBotMsg(t('voiceNotAllowed'));
    else addBotMsg(t('voiceError'));
  };
  recognition.onend=()=>stopListening();
}

function startListening(){
  if(!recognition||isListening)return;
  try{
    recognition.lang=currentLang==='zh'?'zh-CN':'en-US';
    isListening=true;
    voiceBtn.classList.add('listening');
    voiceBtn.textContent='🔴';
    voiceStatus.style.display='block';
    recognition.start();
  }catch(e){stopListening()}
}

function stopListening(){
  isListening=false;
  voiceBtn.classList.remove('listening');
  voiceBtn.textContent='🎤';
  voiceStatus.style.display='none';
  try{recognition&&recognition.stop()}catch(e){}
}

function addUserMsg(text){
  const div=document.createElement('div');
  div.className='msg user';
  div.textContent=text;
  chatArea.appendChild(div);
  chatArea.scrollTop=chatArea.scrollHeight;
  processMessage(text);
}

function addBotMsg(text,asHtml=false){
  const div=document.createElement('div');
  div.className='msg bot';
  if(asHtml)div.innerHTML=text;else div.textContent=text;
  chatArea.appendChild(div);
  chatArea.scrollTop=chatArea.scrollHeight;
}

function showTyping(){
  const div=document.createElement('div');
  div.className='typing';
  div.id='typingIndicator';
  div.innerHTML='<span></span><span></span><span></span>';
  chatArea.appendChild(div);
  chatArea.scrollTop=chatArea.scrollHeight;
}

function hideTyping(){
  const el=document.getElementById('typingIndicator');
  if(el)el.remove();
}

function parseMessage(rawText){
  const text=normalizeInput(rawText);
  const now=new Date();
  const today=formatLocalDate(now);
  const currentTime=now.toTimeString().slice(0,5);

  let event='';
  let volume='';
  let notes=text;
  let parsedTime=currentTime;
  let parsedDate=today;

  const feedingKW=/喝了|喂了|吃了|奶粉|母乳|喝奶|喂奶|吃奶|吸奶|亲喂|瓶喂|哺乳|feed|fed|feeding|formula|breastmilk|bottle|nursing|milk/i;
  const diaperKW=/拉粑粑|拉屎|大便|便便|拉臭|换尿布|尿布|尿了|小便|嘘嘘|拉臭臭|尿不湿|纸尿裤|pee|poop|diaper|nappy|stool|potty|wet diaper|dirty diaper/i;

  if(feedingKW.test(text))event='Feeding';
  else if(diaperKW.test(text))event='Diaper';
  else if(/\d+(?:\.\d+)?\s*(ml|毫升|cc|oz|ounce|ounces)/i.test(text))event='Feeding';
  else event='Other';

  const volMatch=text.match(/(\d+(?:\.\d+)?)\s*(ml|毫升|cc|oz|ounce|ounces)/i);
  if(volMatch){
    const val=parseFloat(volMatch[1]);
    const unit=volMatch[2].toLowerCase();
    volume=(unit==='oz'||unit==='ounce'||unit==='ounces')?String(Math.round(val*29.57)):String(Math.round(val));
    notes=notes.replace(volMatch[0],'').trim();
  }

  let timeExtracted=false;
  const curH=now.getHours();

  function to24h(h,pref){
    if(/am|morning|早上|上午|凌晨|早晨/i.test(pref))return h===12?0:h;
    if(/noon|中午|正午/i.test(pref))return 12;
    if(/pm|afternoon|evening|night|下午|晚上|傍晚|夜里/i.test(pref))return h===12?12:h+12;
    return h;
  }

  function infer24h(h){
    if(h>=13)return h;
    const pmH=h+12;
    if(pmH<=23&&curH>=pmH&&curH-pmH<=2)return pmH;
    return h;
  }

  const enAmPm=text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if(enAmPm){
    const h24=to24h(parseInt(enAmPm[1],10),enAmPm[3]);
    const min=(enAmPm[2]||'00').padStart(2,'0');
    parsedTime=String(h24).padStart(2,'0')+':'+min;
    notes=notes.replace(enAmPm[0],'').trim();
    timeExtracted=true;
  }

  if(!timeExtracted){
    const pfTime=text.match(/(早上|上午|凌晨|早晨|中午|正午|下午|晚上|傍晚|夜里)\s*(\d{1,2})点(?:(\d{1,2})分?)?/i);
    const pfHalf=text.match(/(早上|上午|凌晨|早晨|中午|正午|下午|晚上|傍晚|夜里)\s*(\d{1,2})点半/i);
    if(pfTime||pfHalf){
      const m=pfTime||pfHalf;
      const h24=to24h(parseInt(m[2],10),m[1]);
      const min=pfHalf?'30':(pfTime&&pfTime[3]?pfTime[3].padStart(2,'0'):'00');
      parsedTime=String(h24).padStart(2,'0')+':'+min;
      notes=notes.replace(m[0],'').trim();
      timeExtracted=true;
    }
  }

  if(!timeExtracted){
    const cnTimeMatch=text.match(/(\d{1,2})点(\d{1,2})分?/);
    const cnHalfMatch=text.match(/(\d{1,2})点半/);
    const cnHourMatch=text.match(/(\d{1,2})点/);
    if(cnTimeMatch||cnHalfMatch||cnHourMatch){
      let match,h,min='00';
      if(cnTimeMatch){match=cnTimeMatch;h=parseInt(match[1],10);min=match[2].padStart(2,'0');}
      else if(cnHalfMatch){match=cnHalfMatch;h=parseInt(match[1],10);min='30';}
      else{match=cnHourMatch;h=parseInt(match[1],10);}
      h=infer24h(h);
      parsedTime=String(h).padStart(2,'0')+':'+min;
      notes=notes.replace(match[0],'').trim();
      timeExtracted=true;
    }
  }

  if(!timeExtracted){
    const hhmm=text.match(/\b(\d{1,2})[:](\d{2})\b/);
    if(hhmm){
      let h=parseInt(hhmm[1],10);
      h=infer24h(h);
      parsedTime=String(h).padStart(2,'0')+':'+hhmm[2];
      notes=notes.replace(hhmm[0],'').trim();
      timeExtracted=true;
    }
  }

  if(!timeExtracted){
    const offsets=[
      {re:/刚刚|刚才|just now/i,o:0},
      {re:/(\d+)\s*分钟前|(?:about\s*)?(\d+)\s*min(?:ute)?s?\s*ago/i,o:m=>-parseInt(m[1]||m[2],10)},
      {re:/(\d+)\s*小时前|(?:about\s*)?(\d+)\s*hour(?:s)?\s*ago/i,o:m=>-parseInt(m[1]||m[2],10)*60}
    ];
    for(const item of offsets){
      const m=text.match(item.re);
      if(!m)continue;
      const off=typeof item.o==='function'?item.o(m):item.o;
      if(off!==0){
        const adj=new Date(now.getTime()+off*60000);
        parsedTime=adj.toTimeString().slice(0,5);
        if(off<=-120)parsedDate=formatLocalDate(adj);
      }
      notes=notes.replace(m[0],'').trim();
      break;
    }
  }

  notes=sanitizeNotes(notes,event);
  return{date:parsedDate,time:parsedTime,event,volume:volume||'',notes};
}

function processMessage(text){
  showTyping();
  setTimeout(()=>{
    hideTyping();
    const parsed=parseMessage(text);
    if(parsed.event==='Other'){
      addBotMsg(t('unrecognizedHtml'),true);
      return;
    }
    showConfirmCard(parsed);
  },350);
}

function escAttr(v){
  return String(v||'')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function updateVolumeFieldVisibility(card,clearWhenHidden){
  const eventVal=(card.querySelector('.js-event')?.value||'Other').trim();
  const volRow=card.querySelector('.js-volume-row');
  const volInput=card.querySelector('.js-volume');
  const showVolume=eventVal==='Feeding';
  if(volRow)volRow.classList.toggle('hidden',!showVolume);
  if(volInput&&!showVolume&&clearWhenHidden)volInput.value='';
}

function showConfirmCard(p){
  const plain=t('eventPlain');
  const div=document.createElement('div');
  div.className='card';
  div.setAttribute('data-date',p.date);
  div.innerHTML=`
    <div class="card-title">${t('confirmTitle')}</div>
    <div class="row"><span class="lbl">${t('lblDate')}</span><span>${p.date}</span></div>
    <div class="row edit"><span class="lbl">${t('lblTime')}</span><input class="edit-input js-time" type="time" value="${escAttr(p.time)}"></div>
    <div class="row edit"><span class="lbl">${t('lblEvent')}</span>
      <select class="edit-select js-event">
        <option value="Feeding" ${p.event==='Feeding'?'selected':''}>${plain.Feeding}</option>
        <option value="Diaper" ${p.event==='Diaper'?'selected':''}>${plain.Diaper}</option>
        <option value="Other" ${p.event==='Other'?'selected':''}>${plain.Other}</option>
      </select>
    </div>
    <div class="row edit js-volume-row"><span class="lbl">${t('lblVolume')}</span><input class="edit-input js-volume" type="text" inputmode="decimal" value="${escAttr(p.volume||'')}"></div>
    <div class="row edit"><span class="lbl">${t('lblNotes')}</span><input class="edit-input js-notes" type="text" value="${escAttr(p.notes||'')}"></div>
    <div class="actions">
      <button class="btn cancel" onclick="cancelRecord(this)">${t('btnCancel')}</button>
      <button class="btn confirm" onclick="confirmRecord(this)">${t('btnConfirm')}</button>
    </div>`;
  const eventSelect=div.querySelector('.js-event');
  if(eventSelect){
    eventSelect.addEventListener('change',()=>updateVolumeFieldVisibility(div,true));
  }
  updateVolumeFieldVisibility(div,false);
  chatArea.appendChild(div);
  chatArea.scrollTop=chatArea.scrollHeight;
}

function confirmRecord(btn){
  btn.disabled=true;
  btn.textContent=t('syncing');
  const card=btn.closest('.card');
  try{
    const date=(card.getAttribute('data-date')||formatLocalDate(new Date())).trim();
    let time=(card.querySelector('.js-time')?.value||'').trim();
    if(!/^\d{2}:\d{2}$/.test(time))time=new Date().toTimeString().slice(0,5);

    const eventRaw=(card.querySelector('.js-event')?.value||'Other').trim();
    const event=['Feeding','Diaper','Other'].includes(eventRaw)?eventRaw:'Other';

    let volume=(card.querySelector('.js-volume')?.value||'').trim();
    volume=volume.replace(/[^\d.]/g,'');
    if(volume&&volume.includes('.'))volume=String(Math.round(parseFloat(volume)||0));
    if(volume==='0')volume='';
    if(event!=='Feeding')volume='';

    const notes=(card.querySelector('.js-notes')?.value||'').trim();
    const data={date,time,event,volume,notes};

    addRecord(data);
    card.remove();
    if(isCloudSyncEnabled()){
      const d=encodeURIComponent(JSON.stringify(data));
      window.__syncImgs=window.__syncImgs||[];
      const img=new Image();
      img.src=SYNC_SERVER+'?sync=1&d='+d+'&t='+Date.now();
      window.__syncImgs.push(img);
      setTimeout(()=>{window.__syncImgs.shift()},5000);
      const link=getSheetLinkHtml();
      if(link)addBotMsg(t('syncSubmittedPrefix')+link,true);
      else addBotMsg(t('syncSubmittedNoLink'));
    }else{
      addBotMsg(t('localSaved'));
    }
    refreshSummary();
  }catch(e){
    btn.disabled=false;
    btn.textContent=t('btnConfirm');
    addBotMsg(t('recordFailed'));
  }
}

function cancelRecord(btn){
  btn.closest('.card').remove();
  addBotMsg(t('canceled'));
}

function normalizeSummaryData(raw){
  const fallback=getLocalSummary();
  if(!raw||typeof raw!=='object')return fallback;
  const safeRecords=Array.isArray(raw.records)?raw.records:[];
  return {
    date:String(raw.date||fallback.date),
    feedingCount:parseInt(raw.feedingCount,10)||0,
    diaperCount:parseInt(raw.diaperCount,10)||0,
    totalVolume:parseInt(raw.totalVolume,10)||0,
    records:safeRecords.map(r=>({
      date:String((r&&r.date)||raw.date||fallback.date),
      time:String((r&&r.time)||''),
      event:String((r&&r.event)||'Other'),
      volume:String((r&&r.volume)||''),
      notes:String((r&&r.notes)||'')
    }))
  };
}

function fetchCloudSummary(){
  if(!isCloudSyncEnabled())return Promise.reject(new Error('cloud-sync-disabled'));
  return new Promise((resolve,reject)=>{
    const cbName='__feedingSummaryCb_'+Date.now()+'_'+Math.floor(Math.random()*10000);
    const script=document.createElement('script');
    let done=false;

    const cleanup=()=>{
      if(script.parentNode)script.parentNode.removeChild(script);
      try{delete window[cbName]}catch(e){window[cbName]=undefined}
    };

    const timer=setTimeout(()=>{
      if(done)return;
      done=true;
      cleanup();
      reject(new Error('summary-timeout'));
    },8000);

    window[cbName]=(payload)=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();
      if(payload&&payload.success&&payload.summary){
        resolve(normalizeSummaryData(payload.summary));
      }else{
        reject(new Error('summary-invalid-payload'));
      }
    };

    script.onerror=()=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();
      reject(new Error('summary-script-error'));
    };

    script.async=true;
    script.src=SYNC_SERVER+'?summary=1&tz='+encodeURIComponent(SUMMARY_TIMEZONE)+'&callback='+encodeURIComponent(cbName)+'&t='+Date.now();
    document.body.appendChild(script);
  });
}

function parseSummaryDateParts(dateStr){
  const m=String(dateStr||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!m)return null;
  return {y:parseInt(m[1],10),m:parseInt(m[2],10),d:parseInt(m[3],10)};
}

function formatSummaryDateMd(dateStr){
  const p=parseSummaryDateParts(dateStr);
  if(p)return `${p.m}/${p.d}`;
  const dt=new Date(dateStr);
  if(!isNaN(dt.getTime()))return `${dt.getMonth()+1}/${dt.getDate()}`;
  return '';
}

function parseSummaryTimeParts(timeRaw){
  const s=String(timeRaw||'').trim();
  const hhmm=s.match(/^(\d{1,2}):(\d{2})/);
  if(hhmm)return {h:Math.max(0,Math.min(23,parseInt(hhmm[1],10))),m:Math.max(0,Math.min(59,parseInt(hhmm[2],10)))};
  const loose=s.match(/(\d{1,2}):(\d{2})/);
  if(loose)return {h:Math.max(0,Math.min(23,parseInt(loose[1],10))),m:Math.max(0,Math.min(59,parseInt(loose[2],10)))};
  const dt=new Date(s);
  if(!isNaN(dt.getTime()))return {h:dt.getHours(),m:dt.getMinutes()};
  return null;
}

function formatSummaryTimeAmPm(h,m){
  const hour=((h%12)||12);
  const mm=String(m).padStart(2,'0');
  const ap=h>=12?'pm':'am';
  return `${hour}:${mm} ${ap}`;
}

function buildRecentRecordMeta(r,summaryDate){
  const dateText=formatSummaryDateMd(r.date||summaryDate);
  const dateParts=parseSummaryDateParts(r.date||summaryDate);
  const timeParts=parseSummaryTimeParts(r.time);
  let sortTs=0;
  let timeText=String(r.time||'').trim();

  if(timeParts){
    timeText=formatSummaryTimeAmPm(timeParts.h,timeParts.m);
    if(dateParts){
      sortTs=new Date(dateParts.y,dateParts.m-1,dateParts.d,timeParts.h,timeParts.m,0,0).getTime();
    }else{
      sortTs=(timeParts.h*60)+timeParts.m;
    }
  }

  return {
    sortTs:sortTs,
    text:`${dateText?dateText+' ':''}${timeText} ${eventLabel(r.event)} ${r.volume?r.volume+' ml':''} ${r.notes?'· '+r.notes:''}`.replace(/\s+/g,' ').trim()
  };
}

function renderSummary(s){
  const existing=document.getElementById('summaryCard');
  if(existing)existing.remove();

  const div=document.createElement('div');
  div.className='summary-card';
  div.id='summaryCard';
  const recentRecords=(s.records||[])
    .map(r=>buildRecentRecordMeta(r,s.date))
    .sort((a,b)=>b.sortTs-a.sortTs)
    .slice(0,3)
    .sort((a,b)=>a.sortTs-b.sortTs);
  const recentHtml=recentRecords.map(r=>`<div class="ri">${r.text}</div>`).join('');

  div.innerHTML=`
    <h3>${t('todaySummary')} (${s.date})</h3>
    <div class="stat">
      <div class="si"><div class="n">${s.feedingCount}</div><div class="l">${t('feedingCount')}</div></div>
      <div class="si"><div class="n">${s.totalVolume}ml</div><div class="l">${t('totalVolume')}</div></div>
      <div class="si"><div class="n">${s.diaperCount}</div><div class="l">${t('diaperCount')}</div></div>
    </div>
    ${recentHtml?`<div class="recent"><div class="rh">${t('recentRecords')}</div>${recentHtml}</div>`:''}
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop=chatArea.scrollHeight;
}

function refreshSummary(){
  fetchCloudSummary()
    .then(summary=>renderSummary(summary))
    .catch(()=>renderSummary(getLocalSummary()));
}

function showExport(){
  const records=getRecords().sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));
  const listEl=document.getElementById('recordList');
  if(records.length===0){
    listEl.innerHTML=`<p style="text-align:center;color:#999;padding:20px">${t('noRecords')}</p>`;
  }else{
    listEl.innerHTML=records.map(r=>
      `<div class="record-item">
        <span>${r.date} ${r.time} ${eventPlain(r.event)} ${r.volume?r.volume+'ml':''}</span>
        <button class="del" onclick="delRecord('${r.id}')">🗑</button>
      </div>`
    ).join('');
  }

  const csv=t('csvHeader')+'\n'+records.map(r=>
    `${r.date},${r.time},${r.event},${r.volume},${(r.notes||'').replace(/,/g,' ')}`
  ).join('\n');

  document.getElementById('csvOutput').value=csv;
  document.getElementById('exportModal').classList.add('show');
}

function closeExport(){
  document.getElementById('exportModal').classList.remove('show');
  refreshSummary();
}

function delRecord(id){
  if(!confirm(t('deleteConfirm')))return;
  deleteRecord(id);
  showExport();
}

function copyCSV(){
  const csv=document.getElementById('csvOutput').value;
  navigator.clipboard.writeText(csv)
    .then(()=>alert(t('csvCopied')))
    .catch(()=>alert(t('csvCopyFailed')));
}

function downloadCSV(){
  const csv=document.getElementById('csvOutput').value;
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=t('downloadName');
  a.click();
  URL.revokeObjectURL(url);
}

function setTodayLabel(){
  const now=new Date();
  if(currentLang==='zh'){
    document.getElementById('todayLabel').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${t('weekdays')[now.getDay()]}`;
  }else{
    const mm=String(now.getMonth()+1).padStart(2,'0');
    const dd=String(now.getDate()).padStart(2,'0');
    document.getElementById('todayLabel').textContent=`${now.getFullYear()}-${mm}-${dd} ${t('weekdays')[now.getDay()]}`;
  }
}

function applyLanguage(){
  localStorage.setItem(UI_LANG_KEY,currentLang);
  document.documentElement.lang=currentLang==='zh'?'zh-CN':'en';
  document.title=t('appTitle');
  appTitle.textContent=t('appTitle');
  welcomeMsg.innerHTML=t('welcomeHtml');
  voiceStatus.textContent=t('voiceListening');
  textInput.placeholder=t('inputPlaceholder');
  modalTitle.textContent=t('modalTitle');
  document.getElementById('csvOutput').placeholder=t('noRecords');
  copyBtn.textContent=t('copyCsv');
  downloadBtn.textContent=t('downloadCsv');
  closeBtn.textContent=t('close');
  langBtn.textContent=currentLang==='zh'?'EN':'中';
  setTodayLabel();
  refreshSummary();
  if(recognition)recognition.lang=currentLang==='zh'?'zh-CN':'en-US';
}

function applyFont(){
  document.body.classList.remove('font-sm','font-md','font-lg','font-xl');
  document.body.classList.add('font-'+currentFont);
  localStorage.setItem(UI_FONT_KEY,currentFont);
}

function changeFont(step){
  const levels=['sm','md','lg','xl'];
  let idx=levels.indexOf(currentFont);
  if(idx<0)idx=1;
  idx=Math.max(0,Math.min(levels.length-1,idx+step));
  currentFont=levels[idx];
  applyFont();
}

voiceBtn.addEventListener('click',()=>isListening?stopListening():startListening());
sendBtn.addEventListener('click',sendMessage);
textInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
langBtn.addEventListener('click',()=>{currentLang=currentLang==='zh'?'en':'zh';applyLanguage()});
fontDownBtn.addEventListener('click',()=>changeFont(-1));
fontUpBtn.addEventListener('click',()=>changeFont(1));

function sendMessage(){
  const text=normalizeInput(textInput.value.trim());
  if(!text)return;
  textInput.value='';
  addUserMsg(text);
}

(function init(){
  initSpeech();
  applyFont();
  applyLanguage();
})();
</script>
